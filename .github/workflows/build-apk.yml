name: Build MonitoringEXP APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          mkdir project
          unzip -q *.zip -d project

          ROOT=$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs dirname)

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project: $ROOT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle assembleDebug

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_ROOT" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          test -n "$APK"
          cp "$APK" MonitoringEXP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MonitoringEXP-APK
          path: MonitoringEXP.apk
